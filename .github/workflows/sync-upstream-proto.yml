name: Sync Upstream Proto And Release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      variant:
        description: Version to synchronize
        required: true
        default: all
        type: choice
        options:
          - all
          - main
          - international
          - tv

permissions:
  contents: write

concurrency:
  group: sync-upstream-proto-and-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            target_branch: main
            upstream_ref: main
            tag_prefix: v
          - variant: international
            target_branch: international
            upstream_ref: international
            tag_prefix: international-v
          - variant: tv
            target_branch: tv
            upstream_ref: tv
            tag_prefix: tv-v
    env:
      VARIANT: ${{ matrix.variant }}
      TARGET_BRANCH: ${{ matrix.target_branch }}
      UPSTREAM_REF: ${{ matrix.upstream_ref }}
      TAG_PREFIX: ${{ matrix.tag_prefix }}
      SELECTED_VARIANT: ${{ inputs.variant || 'all' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check selected variant
        id: selection
        shell: bash
        run: |
          if [[ "${SELECTED_VARIANT}" == 'all' || "${SELECTED_VARIANT}" == "${VARIANT}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout upstream repository
        if: steps.selection.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: stmtc233/bapis-proto
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Select target branch
        if: steps.selection.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags '+refs/heads/*:refs/remotes/origin/*'
          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git switch --force-create "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git switch --force-create "${TARGET_BRANCH}" origin/main
          fi

      - name: Capture upstream revision
        if: steps.selection.outputs.enabled == 'true'
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          source_file=upstream/extracted_proto/SOURCE.json
          test -f "${source_file}"
          echo "sha=$(git -C upstream rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"
          echo "full_sha=$(git -C upstream rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version_name=$(jq -er '.version_name' "${source_file}")" >> "${GITHUB_OUTPUT}"
          echo "version_code=$(jq -er '.version_code' "${source_file}")" >> "${GITHUB_OUTPUT}"

      - name: Sync proto files
        if: steps.selection.outputs.enabled == 'true'
        run: bash scripts/sync_upstream_proto.sh upstream/extracted_proto/com/bapis .

      - name: Normalize go_package
        if: steps.selection.outputs.enabled == 'true'
        run: bash scripts/ensure_go_package.sh

      - name: Set up Go
        if: steps.selection.outputs.enabled == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up protoc
        if: steps.selection.outputs.enabled == 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: '25.1'

      - name: Install protoc plugins
        if: steps.selection.outputs.enabled == 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.31.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0

      - name: Generate Go package files
        if: steps.selection.outputs.enabled == 'true'
        run: bash scripts/generate_go.sh

      - name: Test Go package
        if: steps.selection.outputs.enabled == 'true'
        run: go test ./...

      - name: Detect changes
        if: steps.selection.outputs.enabled == 'true'
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- upstream
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine release tag
        if: steps.changes.outputs.changed == 'true'
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag_name="$(bash scripts/next_tag.sh '' "${TAG_PREFIX}")"
          if git rev-parse --verify --quiet "refs/tags/${tag_name}"; then
            echo "tag already exists: ${tag_name}" >&2
            exit 1
          fi
          echo "name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Commit and push synchronized package
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(${VARIANT}): sync proto from upstream ${{ steps.upstream.outputs.sha }} [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Create and push release tag
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ steps.tag.outputs.name }}"
          git push origin "${{ steps.tag.outputs.name }}"

      - name: Publish GitHub Release
        if: steps.changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            Variant: `${{ matrix.variant }}`
            Upstream commit: `${{ steps.upstream.outputs.full_sha }}`
            Upstream app version: `${{ steps.upstream.outputs.version_name }}` (`${{ steps.upstream.outputs.version_code }}`)
