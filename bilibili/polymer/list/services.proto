// Reconstructed from the checked-in gRPC service catalog.
syntax = "proto3";

package bilibili.polymer.list;

import "bilibili/polymer/list/messages.proto";

service List {
  rpc CheckAccount(.com.bapis.bilibili.polymer.list.CheckAccountReq) returns (.com.bapis.bilibili.polymer.list.CheckAccountReply);
  rpc FavoriteTab(.com.bapis.bilibili.polymer.list.FavoriteTabReq) returns (.com.bapis.bilibili.polymer.list.FavoriteTabReply);
}

option go_package = "github.com/stmtc233/bili-grpc-api-go/bilibili/polymer/list";
