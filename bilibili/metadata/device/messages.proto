// Reconstructed from protobuf-lite metadata in the APK.
syntax = "proto3";

package com.bapis.bilibili.metadata.device;

// Source: com/bapis/bilibili/metadata/device/Device.java
message Device {
  int32 appId = 1;
  int32 build = 2;
  string buvid = 3;
  string mobiApp = 4;
  string platform = 5;
  string device = 6;
  string channel = 7;
  string brand = 8;
  string model = 9;
  string osver = 10;
}


option go_package = "github.com/stmtc233/bili-grpc-api-go/bilibili/metadata/device";
