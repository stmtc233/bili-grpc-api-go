// Reconstructed from the checked-in gRPC service catalog.
syntax = "proto3";

package bilibili.broadcast.v1;

import "bilibili/broadcast/v1/messages.proto";
import "google/protobuf/empty.proto";

service Broadcast {
  rpc Auth(.com.bapis.bilibili.broadcast.v1.AuthReq) returns (.com.bapis.bilibili.broadcast.v1.AuthResp);
  rpc Heartbeat(.com.bapis.bilibili.broadcast.v1.HeartbeatReq) returns (.com.bapis.bilibili.broadcast.v1.HeartbeatResp);
  rpc MessageAck(.com.bapis.bilibili.broadcast.v1.MessageAckReq) returns (.google.protobuf.Empty);
  rpc Subscribe(.com.bapis.bilibili.broadcast.v1.TargetPath) returns (.google.protobuf.Empty);
  rpc Unsubscribe(.com.bapis.bilibili.broadcast.v1.TargetPath) returns (.google.protobuf.Empty);
}

service BroadcastRoom {
  rpc Enter(stream .com.bapis.bilibili.broadcast.v1.RoomReq) returns (stream .com.bapis.bilibili.broadcast.v1.RoomResp);
}

service BroadcastTunnel {
  rpc CreateTunnel(stream .com.bapis.bilibili.broadcast.v1.BroadcastFrame) returns (stream .com.bapis.bilibili.broadcast.v1.BroadcastFrame);
}

service Laser {
  rpc WatchLogUploadEvent(.google.protobuf.Empty) returns (stream .com.bapis.bilibili.broadcast.v1.LaserLogUploadResp);
}

service ModManager {
  rpc WatchResource(.google.protobuf.Empty) returns (stream .com.bapis.bilibili.broadcast.v1.ModResourceResp);
}

service Push {
  rpc WatchMessage(.google.protobuf.Empty) returns (stream .com.bapis.bilibili.broadcast.v1.PushMessageResp);
}

service Test {
  rpc WatchTestEvent(.google.protobuf.Empty) returns (stream .com.bapis.bilibili.broadcast.v1.TestResp);
}

option go_package = "github.com/stmtc233/bili-grpc-api-go/bilibili/broadcast/v1";
